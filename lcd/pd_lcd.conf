# pd シンセの LCD (16x2) 表示レイアウト
#
#   ./build/rtsynth --synth pd --lcd 0x27 --lcd-layout lcd/pd_lcd.conf ...
#
# このファイルを書き換えて rtsynth を再起動すると LCD の表示が変わります。
# 1 行 1 文、"#" 以降はコメント。"|" の左が上段、右が下段です。
#
#   param <idパターン> <上段> | <下段>   パラメータが変わったとき
#   preset  <上段> | <下段>              プリセット(トーン)を切り替えたとき
#   startup <上段> | <下段>              起動したとき
#   stop    <上段> | <下段>              終了したとき
#
# idパターンでは * (任意の文字列) と ? (任意の 1 文字) が使えます。
# 複数の param 行に当てはまるときは「後に書いた行」が勝つので、
# 全体の設定を先に、個別の設定を後に書きます。
#
# 使える置き換え:
#   param    {name}   標準の名前        "L1 DCW Rate 1"
#            {value}  標準の値の表記    "0.787" / "Saw" / "Step 3"
#            {id}     パラメータ id     "line1_dcw_rate1"
#            {raw}    0.000 .. 1.000
#            {99}     0 .. 99
#            {1} {2}  パターンの * や ? に当てはまった文字 (左から順に)
#   preset   {n} スロット番号   {preset} 名前
#   startup  {synth} シンセ名   {preset} 起動時のプリセット名
#
# 前後の空白は削られます。残したいときは "  L1  " のように "..." で囲みます。
# 16 文字を超えた分は切れます。表示を確認するには -v param も付けると、
# コンソールに標準の {name} = {value} と id が出ます。
#
# パラメータ id (line は 1/2、dcx は dco/dcw/dca、K は 1..8):
#   line<L>_wave1  line<L>_wave2               波形
#   line<L>_<dcx>_rate<K>  line<L>_<dcx>_level<K>
#   line<L>_<dcx>_sustain  line<L>_<dcx>_end   EG のサステイン/エンド
#   line<L>_dcw_key_follow  line<L>_dca_key_follow
#   line_select  detune_octave  detune_note  detune_fine
#   octave_range  master_tune  mono  volume  ...

# --- 下の行は今の標準表示と同じ内容です。ここから書き換えてください ---

param   *                     {name} | {value}

preset                        PRESET {n} | {preset}
startup                       {synth} | {preset}
stop                          rtsynth | stopped

# --- 書き換え例 (先頭の # を外すと有効) ---
#
# EG のレートとレベルを 0..99 で表示:
#   param line?_*_rate?       {name} | {99}
#   param line?_*_level?      {name} | {99}
#
# DCW のレートを短い名前と 0..99 で ("DCW1 R3" / "87"):
#   param line?_dcw_rate?     DCW{1} R{2} | {99}
