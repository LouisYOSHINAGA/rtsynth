# rtsynth front panel for the pd synth (CZ-101 style)
#
#   ./build/rtsynth --synth pd --lcd 0x27 --panel panels/pd_panel.conf
#
# 33 switches + 19 encoders (71 inputs) on 6 x MCP23017,
# 81 LEDs on 10 x 74HC595 (+1 on an MCP23017 output-only pin). Layout and wiring: README_HW.md, Step 7.
# The pin assignment below is a starting point — change it freely to
# match the board; only the roles carry meaning.

bus /dev/i2c-1
# Every chip that carries encoders gets its own INT line, so turning a
# knob reads one chip, not six. The button-only chips share one line.
expander 0x20 int 4     # 0: row 1 encoders 1-7
expander 0x21 int 12    # 1: row 2 encoders 1-7
expander 0x22 int 16    # 2: encoders 8, detune/vib encoders, row 1 EG switches, line
expander 0x23 int 24    # 3: row switches, vibrato switches
expander 0x24 int 24    # 4: tone section
expander 0x25 int 24    # 5: abs up/down (+ spare inputs)
# keep 0x27 free for the LCD backpack

encoder-quarters 4      # ALPS EC12 no-click, 24 pulses/rev -> 24 steps/rev
encoder-step 0.01
debounce 5
pullups on

shift-register /dev/spidev0.1 10  # 74HC595 chain on SPI0, CE1 = latch

# ======================= EG encoders (rows = lines) =======================
encoder row1.1   0.A0 0.A1
encoder row1.2   0.A2 0.A3
encoder row1.3   0.A4 0.A5
encoder row1.4   0.A6 0.B0
encoder row1.5   0.B1 0.B2
encoder row1.6   0.B3 0.B4
encoder row1.7   0.B5 0.B6
encoder row2.1   1.A0 1.A1
encoder row2.2   1.A2 1.A3
encoder row2.3   1.A4 1.A5
encoder row2.4   1.A6 1.B0
encoder row2.5   1.B1 1.B2
encoder row2.6   1.B3 1.B4
encoder row2.7   1.B5 1.B6
encoder row1.8   2.A0 2.A1
encoder row2.8   2.A2 2.A3

# ======================= detune / vibrato encoders ========================
encoder dv.1     2.A4 2.A5     # detune octave / vibrato delay
encoder dv.2     2.A6 2.B0     # detune note   / vibrato depth
encoder dv.3     2.B1 2.B2     # detune fine   / vibrato rate

# ======================= per-line switches ================================
button  row1.field     2.B3    # rate <-> level
button  row1.sus       2.B4    # sustain point: Off, 1..7
button  row1.end       2.B5    # end point: 2..8
button  line           2.B6    # Line 1 -> 2 -> 1+1' -> 1+2'

button  row1.eg        3.A0    # DCO -> DCW -> DCA
button  row1.wave1     3.A1
button  row1.wave2     3.A2
button  row1.keyfollow 3.A3    # DCW/DCA key follow onto the LCD + abs
button  row2.eg        3.A4
button  row2.wave1     3.A5
button  row2.wave2     3.A6
button  row2.keyfollow 3.B0
button  row2.field     3.B1
button  row2.sus       3.B2
button  row2.end       3.B3

# ======================= vibrato ==========================================
button  vib.on         3.B4
button  vib.wave       3.B5    # tri -> up saw -> down saw -> square
button  detune-vib     3.B6    # what dv.1-3 edit

# ======================= tones ============================================
button  preset         4.A0
button  user           4.A1
button  tone1          4.A2
button  tone2          4.A3
button  tone3          4.A4
button  tone4          4.A5
button  tone5          4.A6
button  tone6          4.B0
button  tone7          4.B1
button  tone8          4.B2
button  page           4.B3    # tone buttons 1-8 <-> 9-16
button  compare        4.B4
button  initialize     4.B5

# ======================= value up / down ==================================
button  abs.down       5.A0
button  abs.up         5.A1
# or an encoder instead of the two switches:
# encoder abs          5.A2 5.A3

# ======================= LEDs (74HC595, sr<chip>.<Q 0-7>) =================
# sustain + end points: step K lit = sustain or end at step K
led row1.step1      sr0.0
led row1.step2      sr0.1
led row1.step3      sr0.2
led row1.step4      sr0.3
led row1.step5      sr0.4
led row1.step6      sr0.5
led row1.step7      sr0.6
led row1.step8      sr0.7
led row2.step1      sr1.0
led row2.step2      sr1.1
led row2.step3      sr1.2
led row2.step4      sr1.3
led row2.step5      sr1.4
led row2.step6      sr1.5
led row2.step7      sr1.6
led row2.step8      sr1.7

led row1.dco        sr2.0
led row1.dcw        sr2.1
led row1.dca        sr2.2
led row1.rate       sr2.3
led row1.level      sr2.4
led row2.dco        sr2.5
led row2.dcw        sr2.6
led row2.dca        sr2.7
led row2.rate       sr3.0
led row2.level      sr3.1
led line.1          sr3.2
led line.2          sr3.3
led line.1'         sr3.4
led line.2'         sr3.5
led vib.on          sr3.6
led detune          sr3.7

# one LED per waveform (wave2 Off = all dark)
led row1.wave1.1    sr4.0
led row1.wave1.2    sr4.1
led row1.wave1.3    sr4.2
led row1.wave1.4    sr4.3
led row1.wave1.5    sr4.4
led row1.wave1.6    sr4.5
led row1.wave1.7    sr4.6
led row1.wave1.8    sr4.7
led row1.wave2.1    sr5.0
led row1.wave2.2    sr5.1
led row1.wave2.3    sr5.2
led row1.wave2.4    sr5.3
led row1.wave2.5    sr5.4
led row1.wave2.6    sr5.5
led row1.wave2.7    sr5.6
led row1.wave2.8    sr5.7
led row2.wave1.1    sr6.0
led row2.wave1.2    sr6.1
led row2.wave1.3    sr6.2
led row2.wave1.4    sr6.3
led row2.wave1.5    sr6.4
led row2.wave1.6    sr6.5
led row2.wave1.7    sr6.6
led row2.wave1.8    sr6.7
led row2.wave2.1    sr7.0
led row2.wave2.2    sr7.1
led row2.wave2.3    sr7.2
led row2.wave2.4    sr7.3
led row2.wave2.5    sr7.4
led row2.wave2.6    sr7.5
led row2.wave2.7    sr7.6
led row2.wave2.8    sr7.7

led vib             sr8.0
led vib.tri         sr8.1
led vib.upsaw       sr8.2
led vib.downsaw     sr8.3
led vib.square      sr8.4
led preset          sr8.5
led user            sr8.6
led page            sr8.7
led tone1           sr9.0
led tone2           sr9.1
led tone3           sr9.2
led tone4           sr9.3
led tone5           sr9.4
led tone6           sr9.5
led tone7           sr9.6
led tone8           sr9.7

# the 81st LED sits on the tone chip's output-only pin, next to its button
led compare         4.A7

# Spare: outputs 0.A7 0.B7 1.A7 1.B7 2.A7 2.B7 3.A7 3.B7 4.B7 5.A7 5.B7,
#        inputs 4.B6 and 5.A2-B6
