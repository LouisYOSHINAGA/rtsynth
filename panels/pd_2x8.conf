# rtsynth panel: pd EG editor, 2 rows x 8 encoders on MCP23017 expanders
#
#   ./build/rtsynth --synth pd --lcd 0x27 --panel panels/pd_2x8.conf
#
# Row 1 edits line 1, row 2 edits line 2; encoder K is EG step K.
#   dco / dcw / dca   which EG the encoders edit        (LED = selection)
#   rate / level      which field                        (LED = selection)
#   sus (hold)        + turn encoder K: sustain point = step K, encoder 8 = Off
#   end (hold)        + turn encoder K: end point = step K (2..8)
#
# Pins are <expander>.<port><bit>. GPA7 / GPB7 (x.A7, x.B7) are OUTPUT-ONLY
# on the MCP23017, so the encoders skip them and the LEDs use them.
# See README_HW.md, Step 7 for the wiring.

bus /dev/i2c-1
expander 0x20        # 0: row 1, encoders 1-7
expander 0x21        # 1: row 2, encoders 1-7
expander 0x22        # 2: encoders 8, buttons, LEDs
# expander 0x23      # 3: step LEDs (optional, see the end of this file)
# Keep 0x27 free: the LCD backpack lives there.

# Wire every chip's INTA to GPIO4 (physical pin 7) to read only on change.
# Without it the chips are polled at scan-rate.
# interrupt 4
scan-rate 1000

# ALPS EC12 (no clicks) at 24 pulses/rev: 4 edges per step = 24 steps/rev.
# Use 2 (or 1) for finer steps, and encoder-step for the size of a step.
encoder-quarters 4
encoder-step 0.01
debounce 5
# The internal ~100k pull-ups are enough. With pull-ups fitted on the
# encoder boards, "off" is fine too (on does no harm either).
pullups on

# --- row 1 (line 1) -------------------------------------------------------
encoder row1.1  0.A0 0.A1
encoder row1.2  0.A2 0.A3
encoder row1.3  0.A4 0.A5
encoder row1.4  0.A6 0.B0
encoder row1.5  0.B1 0.B2
encoder row1.6  0.B3 0.B4
encoder row1.7  0.B5 0.B6
encoder row1.8  2.A0 2.A1

# --- row 2 (line 2) -------------------------------------------------------
encoder row2.1  1.A0 1.A1
encoder row2.2  1.A2 1.A3
encoder row2.3  1.A4 1.A5
encoder row2.4  1.A6 1.B0
encoder row2.5  1.B1 1.B2
encoder row2.6  1.B3 1.B4
encoder row2.7  1.B5 1.B6
encoder row2.8  2.A2 2.A3

# --- selection buttons (switch to GND) --------------------------------------
button dco    2.A4
button dcw    2.A5
button dca    2.A6
button rate   2.B0
button level  2.B1
button sus    2.B2
button end    2.B3
# Other roles: "eg" (cycle dco->dcw->dca), "field" (toggle rate/level),
# and the host actions preset-next / preset-prev / revert / panic.

# --- selection LEDs (pin -> R -> LED -> GND) ---------------------------------
led dco    2.B4
led dcw    2.B5
led dca    2.B6
led rate   2.A7
led level  2.B7
# "sus" / "end" LEDs (lit while held) fit on the spare outputs of 0 and 1:
# led sus  0.A7
# led end  0.B7

# --- step LEDs (optional, 4th expander) --------------------------------------
# Lit: steps up to the end point. While sus / end is held: only that point.
# led row1.step1 3.A0
# led row1.step2 3.A1
# led row1.step3 3.A2
# led row1.step4 3.A3
# led row1.step5 3.A4
# led row1.step6 3.A5
# led row1.step7 3.A6
# led row1.step8 3.A7
# led row2.step1 3.B0
# led row2.step2 3.B1
# led row2.step3 3.B2
# led row2.step4 3.B3
# led row2.step5 3.B4
# led row2.step6 3.B5
# led row2.step7 3.B6
# led row2.step8 3.B7
