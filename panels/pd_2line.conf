# rtsynth panel: pd EG editor — 2 lines x (8 encoders, 4 switches, 20 LEDs)
#                + line select (1 switch, 4 LEDs)
#
#   ./build/rtsynth --synth pd --lcd 0x27 --panel panels/pd_2line.conf
#
# Every row is a complete editor for its line (row 1 = line 1, row 2 = line 2):
#   rowR.eg     DCO -> DCW -> DCA                      LEDs rowR.dco/dcw/dca
#   rowR.field  rate <-> level                         LEDs rowR.rate/level
#   rowR.1..8   encoders: step 1..8 of the selection   (level 8 does not exist)
#   rowR.sus    tap: next sustain point (Off, 1..7)    LEDs rowR.sus1..sus8
#               hold + turn encoder K: sustain at K (encoder 8 = Off)
#   rowR.end    tap: next end point (2..8)             LEDs rowR.end2..end8
#               hold + turn encoder K: end at K
#   line        Line 1 -> Line 2 -> 1+1' -> 1+2'       LEDs line.1..line.4
# (rowR.dco / rowR.rate etc. also work as direct-select buttons.)
#
# 85 pins -> 6 MCP23017. Per row, three chips:
#   a  encoders 1-7                        (A7/B7 are output-only: left free)
#   b  encoder 8, the 4 switches, rate/level LEDs, sustain LEDs on GPB0-7
#   c  DCx LEDs, end LEDs on GPB1-7 (so GPBk sits under encoder k+1)
# Line select lives on the spare pins of row 1's chip c.
# See README_HW.md, Step 7 for the wiring.

bus /dev/i2c-1
expander 0x20        # 0: row 1 a
expander 0x21        # 1: row 1 b
expander 0x22        # 2: row 1 c  (+ line select)
expander 0x23        # 3: row 2 a
expander 0x24        # 4: row 2 b
expander 0x25        # 5: row 2 c
# 0x26 is free; keep 0x27 for the LCD backpack.

# Strongly recommended with 5 chips to read: wire every INTA to GPIO4
# (physical pin 7). Without it the chips are polled continuously.
# interrupt 4
scan-rate 1000

# ALPS EC12 (no clicks) at 24 pulses/rev: 4 edges per step = 24 steps/rev.
encoder-quarters 4
encoder-step 0.01
debounce 5
pullups on

# ============================== row 1 (line 1) ==============================
encoder row1.1   0.A0 0.A1
encoder row1.2   0.A2 0.A3
encoder row1.3   0.A4 0.A5
encoder row1.4   0.A6 0.B0
encoder row1.5   0.B1 0.B2
encoder row1.6   0.B3 0.B4
encoder row1.7   0.B5 0.B6
encoder row1.8   1.A0 1.A1

button  row1.eg      1.A2
button  row1.field   1.A3
button  row1.sus     1.A4
button  row1.end     1.A5

led     row1.rate    1.A6
led     row1.level   1.A7
led     row1.sus1    1.B0
led     row1.sus2    1.B1
led     row1.sus3    1.B2
led     row1.sus4    1.B3
led     row1.sus5    1.B4
led     row1.sus6    1.B5
led     row1.sus7    1.B6
led     row1.sus8    1.B7

led     row1.dco     2.A0
led     row1.dcw     2.A1
led     row1.dca     2.A2
led     row1.end2    2.B1
led     row1.end3    2.B2
led     row1.end4    2.B3
led     row1.end5    2.B4
led     row1.end6    2.B5
led     row1.end7    2.B6
led     row1.end8    2.B7

# ============================== row 2 (line 2) ==============================
encoder row2.1   3.A0 3.A1
encoder row2.2   3.A2 3.A3
encoder row2.3   3.A4 3.A5
encoder row2.4   3.A6 3.B0
encoder row2.5   3.B1 3.B2
encoder row2.6   3.B3 3.B4
encoder row2.7   3.B5 3.B6
encoder row2.8   4.A0 4.A1

button  row2.eg      4.A2
button  row2.field   4.A3
button  row2.sus     4.A4
button  row2.end     4.A5

led     row2.rate    4.A6
led     row2.level   4.A7
led     row2.sus1    4.B0
led     row2.sus2    4.B1
led     row2.sus3    4.B2
led     row2.sus4    4.B3
led     row2.sus5    4.B4
led     row2.sus6    4.B5
led     row2.sus7    4.B6
led     row2.sus8    4.B7

led     row2.dco     5.A0
led     row2.dcw     5.A1
led     row2.dca     5.A2
led     row2.end2    5.B1
led     row2.end3    5.B2
led     row2.end4    5.B3
led     row2.end5    5.B4
led     row2.end6    5.B5
led     row2.end7    5.B6
led     row2.end8    5.B7

# ============================== line select ==============================
button  line        2.A3
led     line.1      2.A4
led     line.2      2.A5
led     line.3      2.A6
led     line.4      2.A7

# Free pins: 0.A7 0.B7 3.A7 3.B7 (output-only), 2.B0, 5.A3-A7, 5.B0.
# Host actions fit there too, e.g.:  button preset-next 5.A3
