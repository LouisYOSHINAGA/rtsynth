# rtsynth panel: pd EG editor — per line: 8 encoders, 4 switches, 19 LEDs
#                + line select: 1 switch, 4 LEDs
#
#   ./build/rtsynth --synth pd --lcd 0x27 --panel panels/pd_2line.conf
#
# Every row is the editor of one line (row 1 = line 1, row 2 = line 2):
#   rowR.eg     DCO -> DCW -> DCA -> DCO              LEDs rowR.dco/dcw/dca
#   rowR.field  rate <-> level                        LEDs rowR.rate/level
#   rowR.1..8   encoders: step 1..8 of the selection  (no level 8 in pd)
#   rowR.sus    next sustain point: Off, 1..7, Off    LEDs rowR.sus1..sus7
#                                                     (all dark = Off)
#   rowR.end    next end point: 2..8, 2               LEDs rowR.end2..end8
#   line        Line 1 -> Line 2 -> 1+1' -> 1+2'      LEDs line.1..line.4
# (rowR.dco, rowR.rate, ... also work as direct-select buttons.)
#
# Inputs (41) on 3 x MCP23017, LEDs (42) on 6 x 74HC595.
# See README_HW.md, Step 7 for the wiring.

bus /dev/i2c-1
expander 0x20        # 0: row 1 encoders 1-7
expander 0x21        # 1: row 2 encoders 1-7
expander 0x22        # 2: encoders 8 and all 9 switches
# keep 0x27 free for the LCD backpack

# Recommended: every INTA to GPIO4 (physical pin 7), then uncomment.
# interrupt 4
scan-rate 1000

# ALPS EC12 (no clicks) at 24 pulses/rev: 4 edges per step = 24 steps/rev.
encoder-quarters 4
encoder-step 0.01
debounce 5
pullups on

# 74HC595 chain on SPI0 CE1 (CE1 = latch). sr0 is the chip wired to MOSI.
shift-register /dev/spidev0.1 6

# ============================== row 1 (line 1) ==============================
encoder row1.1   0.A0 0.A1
encoder row1.2   0.A2 0.A3
encoder row1.3   0.A4 0.A5
encoder row1.4   0.A6 0.B0
encoder row1.5   0.B1 0.B2
encoder row1.6   0.B3 0.B4
encoder row1.7   0.B5 0.B6
encoder row1.8   2.A0 2.A1

button  row1.eg     2.A4
button  row1.field  2.A5
button  row1.sus    2.A6
button  row1.end    2.B0

led     row1.sus1    sr0.0      # under encoder 1
led     row1.sus2    sr0.1      # under encoder 2
led     row1.sus3    sr0.2      # under encoder 3
led     row1.sus4    sr0.3      # under encoder 4
led     row1.sus5    sr0.4      # under encoder 5
led     row1.sus6    sr0.5      # under encoder 6
led     row1.sus7    sr0.6      # under encoder 7
led     row1.end2    sr1.1      # under encoder 2
led     row1.end3    sr1.2      # under encoder 3
led     row1.end4    sr1.3      # under encoder 4
led     row1.end5    sr1.4      # under encoder 5
led     row1.end6    sr1.5      # under encoder 6
led     row1.end7    sr1.6      # under encoder 7
led     row1.end8    sr1.7      # under encoder 8
led     row1.dco     sr4.0
led     row1.dcw     sr4.1
led     row1.dca     sr4.2
led     row1.rate    sr5.0
led     row1.level   sr5.1

# ============================== row 2 (line 2) ==============================
encoder row2.1   1.A0 1.A1
encoder row2.2   1.A2 1.A3
encoder row2.3   1.A4 1.A5
encoder row2.4   1.A6 1.B0
encoder row2.5   1.B1 1.B2
encoder row2.6   1.B3 1.B4
encoder row2.7   1.B5 1.B6
encoder row2.8   2.A2 2.A3

button  row2.eg     2.B1
button  row2.field  2.B2
button  row2.sus    2.B3
button  row2.end    2.B4

led     row2.sus1    sr2.0      # under encoder 1
led     row2.sus2    sr2.1      # under encoder 2
led     row2.sus3    sr2.2      # under encoder 3
led     row2.sus4    sr2.3      # under encoder 4
led     row2.sus5    sr2.4      # under encoder 5
led     row2.sus6    sr2.5      # under encoder 6
led     row2.sus7    sr2.6      # under encoder 7
led     row2.end2    sr3.1      # under encoder 2
led     row2.end3    sr3.2      # under encoder 3
led     row2.end4    sr3.3      # under encoder 4
led     row2.end5    sr3.4      # under encoder 5
led     row2.end6    sr3.5      # under encoder 6
led     row2.end7    sr3.6      # under encoder 7
led     row2.end8    sr3.7      # under encoder 8
led     row2.dco     sr4.3
led     row2.dcw     sr4.4
led     row2.dca     sr4.5
led     row2.rate    sr5.2
led     row2.level   sr5.3

# ============================== line select ==============================
button  line        2.B5
led     line.1      sr5.4
led     line.2      sr5.5
led     line.3      sr5.6
led     line.4      sr5.7

# Free: 2.B6 (input), 0/1/2 .A7 .B7 (output only),
#       sr0.7 sr1.0 sr2.7 sr3.0 sr4.6 sr4.7.
# A host action fits on 2.B6, e.g.:  button preset-next 2.B6
